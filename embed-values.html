<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핵심가치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="wrap">
        <div class="head">
          <div class="lrow rise d1"><span class="label">VALUES</span></div>
          <h1 class="rise d1">핵심가치</h1>
          <p class="rise d2">일과 업무의 판단 기준이 모호할 때, 이 세 가지 가치를 기준으로 판단합니다.</p>
        </div>

        <div class="cards">
          <div class="card rise d3">
            <div class="top"><span class="num">01</span><span class="en">CUSTOMER</span></div>
            <div class="name">고객가치</div>
            <div class="tag">유저를 위한</div>
            <p class="body">우리의 모든 ‘일’은<br><b>유저를 위한 가치</b>로 연결됩니다.</p>
          </div>

          <div class="card rise d4">
            <div class="top"><span class="num">02</span><span class="en">INNOVATION</span></div>
            <div class="name">혁신</div>
            <div class="tag">더 나은 답</div>
            <p class="body">원래 그런 것은 없습니다.<br>더 나은 답은 <b>항상 있습니다.</b></p>
          </div>

          <div class="card rise d5">
            <div class="top"><span class="num">03</span><span class="en">TRUST</span></div>
            <div class="name">신뢰</div>
            <div class="tag">있는 그대로</div>
            <p class="body">정보는 있는 그대로 <b>투명하게</b> 공유합니다.<br>결정되면 <b>결정을 신뢰</b>합니다.</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
