<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록 캠페인 · 왜 ② 출퇴근 기록은 기준 (문장)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">출퇴근 기록 캠페인</span><span class="cp-tag">이유 2/2</span></div>
      <p class="cp-q rise d1">왜 지켜야 하나요?</p>

      <!-- 「너무 복잡하다」 지적(10/15)으로 갈래 도해를 걷고, 윌리가 준 문장을 크게 + 한 줄 요청만 -->
      <h1 class="wp-stmt">
        <span class="ln cp-up" style="--d:.5s">출퇴근 기록은 실제 근무시간을 확인하고,</span>
        <span class="ln cp-up" style="--d:.9s">자율출퇴근제를 신뢰 속에 운영하는 <em class="fx-g" style="--d:1.7s">기준</em>입니다.</span>
      </h1>

      <div class="wp-band bx cp-up" style="--d:2.0s">
        <span class="pill">따라서</span><span class="t">출퇴근은</span>
        <span class="cg cp-pop" style="--d:2.4s">본인이 직접</span><span class="cg cp-pop" style="--d:2.7s">정확하게</span>
        <span class="t">기록해 주세요.</span>
      </div>

      <div class="cp-foot">기록은 <b>즉시</b>, 수정은 <b>3일 이내</b></div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
