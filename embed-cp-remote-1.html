<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="stage-wrap">

    <section class="s">
      <div class="cp-top"><span class="cp-bug">재택근무 안내</span><span class="cp-tag">질병·부상·육아 등 · 1/3</span></div>
      <h1 class="cp-h1 rise d1">재택근무, <em class="fx-g" style="--d:.9s">언제</em> 쓸 수 있나요?</h1>

      <!-- 분기도: 출퇴근이 어렵다 → 업무는 가능한가? → 가능: 재택근무 / 어려움: 병가·연차
           화살표는 차례로 그려진다 (Q → 판단 → 두 갈래) -->
      <svg class="cp-svg" viewBox="0 0 1920 1080" aria-hidden="true">
        <g fill="none" stroke="#0F1B14" stroke-width="8" stroke-linejoin="round">
          <path class="rf-ln" style="--len:66;--d:.8s"  d="M606 470 H672"/>
          <path class="rf-ln" style="--len:278;--d:1.8s" d="M1044 470 H1090 V396 H1248"/>
          <path class="rf-ln" style="--len:355;--d:1.9s" d="M1044 470 H1090 V621 H1248"/>
        </g>
        <g fill="#0F1B14">
          <polygon class="rf-hd" style="--d:1.2s"  points="692,470 668,455 668,485"/>
          <polygon class="rf-hd" style="--d:2.35s" points="1266,396 1242,381 1242,411"/>
          <polygon class="rf-hd" style="--d:2.45s" points="1266,621 1242,606 1242,636"/>
        </g>
      </svg>

      <div class="rf-n rf-q bx cp-up" style="--d:.4s">질병·부상·육아<br>등으로 출퇴근이<br>어렵다면</div>
      <div class="rf-n rf-d bx cp-up" style="--d:1.3s">업무는<br>가능한가요?</div>
      <span class="rf-br y cp-pop" style="left:1108px;top:346px;--d:2.1s">가능</span>
      <span class="rf-br n cp-pop" style="left:1108px;top:571px;--d:2.2s">어려움</span>
      <div class="rf-n rf-y bx cp-pop" style="--d:2.4s">재택근무<small><em>연 20일</em></small></div>
      <div class="rf-n rf-no bx cp-pop" style="--d:2.6s">병가 · 연차<small>업무가 어려운 경우</small></div>

      <div class="rf-tile a bx cp-up" style="--d:2.9s"><span class="k">사용</span><div class="t">분할 사용 가능<br><small>1회 최소 5일 이상 연속</small></div></div>
      <div class="rf-tile b bx cp-up" style="--d:3.1s"><span class="k">추가 사용</span><div class="t">조직장 승인이 필요합니다</div></div>
      <p class="rf-fn cp-up" style="--d:3.2s">기존 사용자는 사용 이력을 반영해 잔여 일수를 다시 계산합니다.</p>
