<div id="stage-wrap">

      <div class="rd-bar bx">

      <span class="rd-ax l cp-up" style="left:130px;--d:1.4s">8시</span>
      <span class="rd-ax cp-up" style="left:432px;--d:1.5s">10시</span>
      <span class="rd-ax cp-up" style="left:1488px;--d:1.6s">17시</span>
      <span class="rd-ax r cp-up" style="--d:1.7s">19시</span>

      <div class="rd-card a bx cp-up" style="--d:1.8s"><div class="k">근무</div><div class="v">일 최대 <em>8시간</em><small>코어타임 준수</small></div></div>
      <div class="rd-card b bx cp-up" style="--d:2.1s"><div class="k">8시간 초과 근무 시</div><div class="v" style="font-size:64px"><em>조직장 사전 승인</em> 필수!</div></div>
