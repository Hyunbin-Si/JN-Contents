<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베리굿 소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --berry:#E8474B;
    --berry-deep:#C93438;
    --berry-soft:#FFE9EA;
    --berry-softer:#FFF6F6;
    --leaf:#5FAE3C;
    --leaf-soft:#EAF6E3;
    --ink:#2B2B33;
    --ink-sub:#6B6B76;
    --cream:#FFFDFB;
    --gold:#F5B71E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#F3EFEC;}
  body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);}

  #stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;flex:0 0 auto;width:1920px;height:1080px;transform-origin:center center;background:var(--cream);overflow:hidden;}

  .slide{position:absolute;inset:0;}
  .dotgrid{position:absolute;width:220px;height:160px;opacity:.5;
    background-image:radial-gradient(var(--berry-soft) 6px, transparent 6px);
    background-size:36px 36px;}

  #s1{background:
      radial-gradient(1100px 800px at 22% 42%, #FFFFFF 0%, #FFFFFF 46%, rgba(255,255,255,0) 70%),
      linear-gradient(135deg, #FFF9F7 0%, #FFF1F0 55%, #FFEAE4 100%);}
  #s1 .layout{position:absolute;inset:0;display:flex;align-items:center;padding:0 110px;gap:70px;}

  .hero{position:relative;flex:0 0 640px;height:760px;display:flex;align-items:center;justify-content:center;}
  .hero-ring{position:absolute;width:600px;height:600px;border-radius:50%;
    background:#FFFFFF;
    box-shadow:0 24px 70px rgba(232,71,75,.16), 0 0 0 14px rgba(255,255,255,.7), 0 0 0 15px rgba(232,71,75,.10);}
  .hero img{position:relative;width:520px;height:520px;border-radius:50%;
    animation:berryBounce 2.6s ease-in-out infinite;}
  @keyframes berryBounce{
    0%,100%{transform:translateY(0) rotate(-2deg) scale(1);}
    30%{transform:translateY(-24px) rotate(2deg) scale(1.02);}
    55%{transform:translateY(0) rotate(-1deg) scale(.995);}
    70%{transform:translateY(-8px) rotate(1.5deg) scale(1.005);}
  }

  .intro-copy{flex:1;position:relative;}
  .app-badge{display:inline-flex;align-items:center;gap:12px;background:#FFFFFF;
    border:2px solid var(--berry-soft);border-radius:999px;padding:12px 26px;
    font-size:24px;font-weight:700;color:var(--berry);
    box-shadow:0 8px 24px rgba(232,71,75,.12);}
  .app-badge .pulse-dot{width:14px;height:14px;border-radius:50%;background:var(--berry);
    animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(232,71,75,.45);}
    60%{box-shadow:0 0 0 12px rgba(232,71,75,0);}
  }
  .intro-title{margin-top:34px;font-size:132px;font-weight:900;line-height:1.06;letter-spacing:-.02em;}
  .intro-title .berry-text{color:var(--berry);position:relative;display:inline-block;}
  .intro-title .berry-text::after{content:'';position:absolute;left:2px;right:2px;bottom:8px;height:26px;
    background:rgba(245,183,30,.35);z-index:-1;border-radius:8px;}
  .birth-chip{display:inline-flex;align-items:center;gap:14px;margin-top:28px;
    background:var(--leaf-soft);color:#3E7A22;border-radius:18px;padding:14px 28px;
    font-size:30px;font-weight:800;}
  .birth-chip .cake{font-size:36px;display:inline-block;animation:cakeWiggle 2.2s ease-in-out infinite;}
  @keyframes cakeWiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  .intro-sub{margin-top:36px;font-size:40px;font-weight:800;line-height:1.45;color:var(--ink);}
  .intro-sub em{font-style:normal;color:var(--berry);}
  .msg-lines{margin-top:38px;display:flex;flex-direction:column;gap:20px;}
  .msg-line{display:flex;align-items:center;gap:18px;background:#FFFFFF;border-radius:20px;
    padding:22px 30px;font-size:31px;font-weight:600;color:var(--ink);line-height:1.55;
    box-shadow:0 10px 28px rgba(43,43,51,.07);border:1.5px solid #FBEDEC;}
  .msg-line .ic{font-size:36px;flex:0 0 auto;}
  .msg-line b{color:var(--berry);font-weight:800;}
  .cta-line{margin-top:40px;display:inline-flex;align-items:center;gap:16px;
    background:linear-gradient(120deg, var(--berry) 0%, #F26A6E 100%);
    color:#fff;border-radius:999px;padding:22px 44px;font-size:34px;font-weight:800;
    box-shadow:0 16px 40px rgba(232,71,75,.35);
    animation:ctaBob 2.4s ease-in-out infinite;}
  @keyframes ctaBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  .rise{opacity:0;transform:translateY(36px);animation:riseIn .8s cubic-bezier(.2,.8,.25,1) forwards;}
  .d1{animation-delay:.15s;} .d2{animation-delay:.35s;}
  .d3{animation-delay:.55s;} .d4{animation-delay:.75s;}
  .d5{animation-delay:.95s;} .d6{animation-delay:1.15s;}
  .d7{animation-delay:1.4s;}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
  .pop{opacity:0;transform:scale(.6);animation:popIn 1s cubic-bezier(.18,1.2,.3,1) forwards;}
  @keyframes popIn{to{opacity:1;transform:scale(1);}}

  /* ── 낙엽 효과 (꽃가루 대체) ──
     둥둥: 천천히 떨어지며 좌우로 흔들리고 뒤집힌다 (콘텐츠 뒤)
     휘리릭: 가끔 화면을 가로질러 빠르게 날아간다 (콘텐츠 앞) */
  #leaf-back,#leaf-front{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  #leaf-front{z-index:6;}
  .lf{position:absolute;top:0;left:0;pointer-events:none;will-change:transform;}
  .lf svg{width:100%;height:100%;display:block;overflow:visible;will-change:transform;
    fill:currentColor;stroke:currentColor;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;}

  @keyframes lfDrift{
    0%  {transform:translate3d(var(--x0),-140px,0) rotate(var(--r0));}
    100%{transform:translate3d(var(--x1),1220px,0) rotate(var(--r1));}
  }
  @keyframes lfFlutter{
    0%,100%{transform:translateX(-34px) rotate(-24deg) scaleX(1);}
    25%    {transform:translateX(-2px)  rotate(-4deg)  scaleX(.4);}
    50%    {transform:translateX(34px)  rotate(24deg)  scaleX(1);}
    75%    {transform:translateX(2px)   rotate(4deg)   scaleX(.4);}
  }
  @keyframes lfGust{
    0%   {transform:translate3d(-200px,var(--y0),0) rotate(0deg);opacity:0;}
    2%   {opacity:1;}
    8%   {transform:translate3d(360px,calc(var(--y0) + var(--dy1)),0) rotate(var(--g1));}
    16%  {transform:translate3d(920px,calc(var(--y0) + var(--dy2)),0) rotate(var(--g2));}
    24%  {transform:translate3d(1500px,calc(var(--y0) + var(--dy3)),0) rotate(var(--g3));}
    30%  {transform:translate3d(2120px,calc(var(--y0) + var(--dy4)),0) rotate(var(--g4));opacity:1;}
    31%,100%{transform:translate3d(2120px,calc(var(--y0) + var(--dy4)),0) rotate(var(--g4));opacity:0;}
  }
  @keyframes lfFlutterFast{
    0%,100%{transform:scaleX(1) rotate(-12deg);}
    50%    {transform:scaleX(.35) rotate(12deg);}
  }
</style>
</head>
<body>
<!-- 낙엽 스프라이트 (단풍 · 은행 · 잎) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="lf-maple" viewBox="0 0 100 100">
    <path d="M50 6 Q54 18 60 22 Q66 12 74 8 Q72 24 70 34 Q82 30 94 28 Q88 40 82 48 Q90 54 96 58 Q80 64 72 64 Q74 72 78 80 Q64 76 56 70 L56 96 L44 96 L44 70 Q36 76 22 80 Q26 72 28 64 Q20 64 4 58 Q10 54 18 48 Q12 40 6 28 Q18 30 30 34 Q28 24 26 8 Q34 12 40 22 Q46 18 50 6 Z"/>
    <path d="M50 94 L50 14 M50 64 L16 54 M50 64 L84 54 M50 46 L28 24 M50 46 L72 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.6"/>
  </symbol>
  <symbol id="lf-ginkgo" viewBox="0 0 100 100">
    <path d="M50 98 L47 70 C30 66 6 50 4 20 C12 14 22 18 30 22 C38 12 44 14 50 28 C56 14 62 12 70 22 C78 18 88 14 96 20 C94 50 70 66 53 70 Z"/>
    <path d="M50 70 L14 26 M50 70 L32 24 M50 70 L50 30 M50 70 L68 24 M50 70 L86 26" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="2.6"/>
  </symbol>
  <symbol id="lf-oval" viewBox="0 0 100 100">
    <path d="M50 4 C80 26 88 62 54 92 L54 98 L46 98 L46 92 C12 62 20 26 50 4 Z"/>
    <path d="M50 20 L50 92 M50 40 L33 30 M50 40 L67 30 M50 56 L29 45 M50 56 L71 45 M50 72 L35 63 M50 72 L65 63" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.6"/>
  </symbol>
</defs></svg>

<div id="stage-wrap">
  <div id="stage">
    <section class="slide" id="s1">
      <div class="dotgrid" style="top:70px;right:130px;"></div>
      <div class="dotgrid" style="bottom:90px;left:60px;width:160px;"></div>
      <div id="leaf-back"></div>

      <div class="layout">
        <div class="hero pop">
          <div class="hero-ring"></div>
          <img src="berrygood.png" alt="베리굿 캐릭터">
        </div>

        <div class="intro-copy">
          <div class="app-badge rise d1"><span class="pulse-dot"></span>NEW · 슬랙 앱 출시 <span style="font-size:20px;color:var(--ink-sub);font-weight:600;">Slack App</span></div>
          <h1 class="intro-title rise d2">🍓 <span class="berry-text">베리굿</span></h1>
          <div class="birth-chip rise d3"><span class="cake">🎂</span> 생일 · 7월 10일</div>
          <p class="intro-sub rise d4">서로를 인정하고, 감사와 응원하는<br><em>'베리굿'</em> 서비스</p>
          <div class="msg-lines">
            <div class="msg-line rise d5"><span class="ic">🍓</span><span>'베리굿'으로 동료에게 쉽게 <b>칭찬과 감사</b>를 보내요.</span></div>
            <div class="msg-line rise d6"><span class="ic">🍓</span><span>축하와 응원의 마음은 '베리굿'으로 <b>쉽게 표현</b>해요.</span></div>
          </div>
          <div class="cta-line rise d7">오늘도, 곁에 있는 동료에게 🍓 베리굿! 보내보세요!</div>
        </div>
      </div>
      <div id="leaf-front"></div>
    </section>
  </div>
</div>

<script>
(function(){
  function fit(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  /* ── 낙엽 ── */
  var COLORS = ['#D8452D','#E8741C','#F2B632','#A96A35','#E9A22B','#C23B28'];
  var TYPES  = ['maple','ginkgo','oval','maple','ginkgo'];
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function px(n){ return n.toFixed(0) + 'px'; }
  function deg(n){ return n.toFixed(0) + 'deg'; }
  function makeLeaf(i, size, innerAnim){
    var el = document.createElement('div');
    el.className = 'lf';
    el.style.width = el.style.height = px(size);
    el.style.color = COLORS[i % COLORS.length];
    el.innerHTML = '<svg viewBox="0 0 100 100" style="animation:' + innerAnim + '"><use href="#lf-' + TYPES[i % TYPES.length] + '"/></svg>';
    return el;
  }

  /* 둥둥 — 천천히 떨어지며 좌우로 흔들리고 뒤집힌다 */
  var back = document.getElementById('leaf-back');
  for (var i = 0; i < 20; i++) {
    var size = rnd(40, 92), dur = rnd(15, 26), x0 = rnd(-60, 1900), r0 = rnd(-180, 180);
    var el = makeLeaf(i, size, 'lfFlutter ' + rnd(3.4, 6.2).toFixed(1) + 's ease-in-out ' + (-rnd(0, 6)).toFixed(1) + 's infinite');
    el.style.setProperty('--x0', px(x0));
    el.style.setProperty('--x1', px(x0 + rnd(80, 340)));
    el.style.setProperty('--r0', deg(r0));
    el.style.setProperty('--r1', deg(r0 + (Math.random() < .5 ? -1 : 1) * rnd(200, 420)));
    el.style.animation = 'lfDrift ' + dur.toFixed(1) + 's linear ' + (-rnd(0, dur)).toFixed(1) + 's infinite';
    if (size > 74) { el.style.filter = 'blur(1.4px)'; el.style.opacity = '.8'; }
    back.appendChild(el);
  }

  /* 휘리릭 — 가끔 화면을 가로질러 빠르게 날아간다 (2.5~4초 비행 후 쉬었다가 반복) */
  var front = document.getElementById('leaf-front');
  var starts = [0.8, 2.9, 5.0, 7.2, 9.4];
  for (var g = 0; g < starts.length; g++) {
    var D = rnd(8.5, 12.5), sgn = Math.random() < .5 ? -1 : 1;
    var gl = makeLeaf(g + 2, rnd(48, 78),'lfFlutterFast ' + rnd(.45, .7).toFixed(2) + 's ease-in-out infinite');
    gl.style.setProperty('--y0', px(rnd(120, 860)));
    gl.style.setProperty('--dy1', px(rnd(-170, 170)));
    gl.style.setProperty('--dy2', px(rnd(-260, 260)));
    gl.style.setProperty('--dy3', px(rnd(-260, 260)));
    gl.style.setProperty('--dy4', px(rnd(-200, 200)));
    gl.style.setProperty('--g1', deg(sgn * 240));
    gl.style.setProperty('--g2', deg(sgn * 560));
    gl.style.setProperty('--g3', deg(sgn * 900));
    gl.style.setProperty('--g4', deg(sgn * 1300));
    gl.style.animation = 'lfGust ' + D.toFixed(1) + 's linear ' + starts[g].toFixed(1) + 's infinite';
    gl.style.opacity = '0';
    front.appendChild(gl);
  }
})();
</script>
</body>
</html>
