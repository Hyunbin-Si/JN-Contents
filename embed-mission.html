<!DOCTYPE html>
<html lang="ko">
<head>

<title>미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="stmt">
        <div class="label rise d1">MISSION</div>
        <h1 class="title rise d2">누구나 자기 <em class="fx-g" style="--d:1.3s">자산</em>으로<br><em class="fx-g" style="--d:2.1s">돈을 만들 수 있게</em> 한다.</h1>
      </div>
      <div class="band rise d4">
        <span class="pill">한 줄 번역</span>
        <span class="txt"><span class="fx-in" style="--d:1.2s">내 서랍을</span> <span class="fx-inR" style="--d:2s">내 지갑으로.</span></span>
      </div>
    </section>
  </div>
</div>
