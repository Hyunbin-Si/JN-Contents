<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록 캠페인 · 약속 3 수정은 3일 이내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">출퇴근 기록 캠페인</span><span class="cp-tag">약속 3/3</span></div>

      <div class="pr-l">
        <div class="pr-n cp-up" style="--d:.2s">3</div>
        <h1 class="pr-h rise d2">수정은 <em class="fx-g" style="--d:1.0s">3일 이내</em>,<br>사유와 함께.</h1>
        <p class="pr-s rise d3">수정이 필요하면 <b>3일 이내</b>에<br>사유와 함께 요청해 주세요.</p>
      </div>

      <!-- 그린 패널: 1일째 · 2일째 · 3일째(기한) -->
      <div class="pr-p bx">
        <div class="d-t cp-up" style="--d:.6s">수정 요청 기한</div>
        <div class="d-row">
          <div class="dy bx cp-pop" style="--d:.9s"><small>1일째</small><b>1</b></div>
          <div class="dy bx cp-pop" style="--d:1.25s"><small>2일째</small><b>2</b></div>
          <div class="dy last bx cp-pop" style="--d:1.6s"><small>3일째</small><b>3</b><span class="fl">기한</span></div>
        </div>
        <div class="d-note cp-up" style="--d:2.1s"><span class="pl">사유 <b>필수</b> 등록</span></div>
      </div>

      <div class="cp-foot">기록은 <b>즉시</b>, 수정은 <b>3일 이내</b></div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
