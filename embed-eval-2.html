<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 평가 구조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#217A3C; --cyan:#4FB06D; --cyan-soft:#E9F6EC; --navy:#173F26;
    --ink:#232A31; --ink-sub:#66707A; --line:#E5EEE7; --cream:#FDFFFD;
    --green:#0E7A5F; --green-soft:#E2F1ED;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#EEF1F4;}
  body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);}

  #stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;flex:0 0 auto;width:1920px;height:1080px;transform-origin:center center;
    background:var(--cream);overflow:hidden;}
  .slide{position:absolute;inset:0;}

  .rise{opacity:0;transform:translateY(36px);animation:riseIn .8s cubic-bezier(.2,.8,.25,1) forwards;}
  .d1{animation-delay:.15s;} .d2{animation-delay:.4s;}
  .d3{animation-delay:.65s;} .d4{animation-delay:.9s;}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}

  .head{display:flex;align-items:center;gap:24px;}
  .head .kicker{display:inline-flex;align-items:center;gap:12px;background:var(--cyan-soft);
    color:var(--blue);border-radius:999px;padding:12px 28px;font-size:26px;font-weight:800;}
  .head .kicker .dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);
    animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(79,176,109,.45);}
    60%{box-shadow:0 0 0 11px rgba(79,176,109,0);}
  }
  .head .who{margin-left:auto;font-size:24px;font-weight:600;color:var(--ink-sub);
    background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:11px 26px;}
  h1.big{font-size:76px;font-weight:900;letter-spacing:-.02em;margin-top:30px;line-height:1.2;}
  h1.big em{font-style:normal;color:var(--blue);}

  #s2{background:
      radial-gradient(900px 700px at 12% 90%, #ECF8EF 0%, rgba(236,248,239,0) 55%),
      linear-gradient(200deg,#FFFFFF 0%,#F6FBF7 100%);}
  #s2 .layout{position:absolute;inset:0;padding:80px 130px 130px;display:flex;flex-direction:column;}
  #s2 h1.big{font-size:64px;}

  .role-cards{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:1;min-height:0;}
  .role-card{background:#FFFFFF;border-radius:32px;border:1.5px solid var(--line);
    padding:44px 50px;box-shadow:0 18px 46px rgba(35,42,49,.07);display:flex;flex-direction:column;}
  .role-card .role-head{display:flex;align-items:center;gap:20px;}
  .role-card .role-ic{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:42px;}
  .role-card.member .role-ic{background:var(--cyan-soft);}
  .role-card.leader .role-ic{background:var(--green-soft);}
  .role-card .role-name{font-size:44px;font-weight:900;}
  .role-card .role-sum{margin-left:auto;font-size:24px;font-weight:700;color:var(--ink-sub);}

  .ratio-bar{margin-top:38px;display:flex;height:96px;border-radius:20px;overflow:hidden;
    box-shadow:inset 0 0 0 1.5px var(--line);}
  .ratio-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:#fff;min-width:0;width:0;animation:grow 1.2s cubic-bezier(.25,.9,.3,1) forwards;}
  .g1{animation-delay:.7s;} .g2{animation-delay:1.0s;}
  @keyframes grow{to{width:var(--w);}}
  .ratio-seg .pct{font-size:38px;font-weight:900;line-height:1;white-space:nowrap;}
  .ratio-seg .lbl{font-size:21px;font-weight:700;opacity:.92;white-space:nowrap;}
  .seg-perf{background:linear-gradient(150deg,var(--cyan) 0%,var(--blue) 100%);}
  .seg-comp{background:var(--navy);}
  .seg-lead{background:var(--green);}

  .split-row{margin-top:30px;display:flex;gap:16px;}
  .split-chip{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;
    background:var(--cyan-soft);border-radius:14px;padding:18px 10px;
    font-size:25px;font-weight:700;color:var(--navy);}
  .split-chip b{font-size:30px;font-weight:900;color:var(--blue);}
  .other-chip{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:14px;
    border-radius:14px;padding:18px 10px;font-size:25px;font-weight:700;}
  .role-card.member .other-chip{background:#EDF0F5;color:var(--navy);}
  .role-card.leader .other-chip{background:var(--green-soft);color:#25612F;}
  .other-chip b{font-size:30px;font-weight:900;}

  .foot-note{margin-top:40px;display:flex;align-items:center;gap:16px;justify-content:center;
    font-size:26px;font-weight:600;color:var(--ink-sub);}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="slide" id="s2">
      <div class="layout">
        <div class="head rise d1">
          <span class="kicker"><span class="dot"></span>2026 · 평가 구조</span>
          <span class="who">인사팀 · People</span>
        </div>
        <h1 class="big rise d1">중고나라 2026년 평가는<br><em>성과평가</em>와 <em>역량평가</em>로 진행됩니다</h1>

        <div class="role-cards">
          <div class="role-card member rise d2">
            <div class="role-head">
              <span class="role-ic">🙋</span>
              <span class="role-name">팀원</span>
              <span class="role-sum">성과 60% + 역량 40%</span>
            </div>
            <div class="ratio-bar">
              <div class="ratio-seg seg-perf g1" style="--w:60%;">
                <span class="pct">60%</span><span class="lbl">성과평가</span>
              </div>
              <div class="ratio-seg seg-comp g2" style="--w:40%;">
                <span class="pct">40%</span><span class="lbl">역량평가</span>
              </div>
            </div>
            <div class="split-row">
              <span class="split-chip">상반기 <b>30%</b></span>
              <span class="split-chip">하반기 <b>30%</b></span>
            </div>
            <div class="other-chip">역량평가 <b>40%</b></div>
          </div>

          <div class="role-card leader rise d3">
            <div class="role-head">
              <span class="role-ic">🧭</span>
              <span class="role-name">팀장</span>
              <span class="role-sum">성과 70% + 리더 30%</span>
            </div>
            <div class="ratio-bar">
              <div class="ratio-seg seg-perf g1" style="--w:70%;">
                <span class="pct">70%</span><span class="lbl">성과평가</span>
              </div>
              <div class="ratio-seg seg-lead g2" style="--w:30%;">
                <span class="pct">30%</span><span class="lbl">리더평가</span>
              </div>
            </div>
            <div class="split-row">
              <span class="split-chip">상반기 <b>35%</b></span>
              <span class="split-chip">하반기 <b>35%</b></span>
            </div>
            <div class="other-chip">리더평가 <b>30%</b></div>
          </div>
        </div>

        <div class="foot-note rise d4">성과는 반기별로 나누어 평가하고, 역량·리더평가와 합산합니다.</div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  function fit(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
