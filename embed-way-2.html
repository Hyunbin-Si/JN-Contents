<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일하는 방식 ② 문제를 대하는 태도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>.card{--tag-size:32px;}</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="wrap">
        <div class="head">
          <div class="lrow rise d1"><span class="label">WAY OF WORKING</span><span class="chip">GROUP B · 3가지</span></div>
          <h1 class="rise d1">일하는 방식</h1>
          <div class="prow rise d2"><span class="gpill">문제를 대하는 태도</span><p>일과 동료를 대하는 다섯 가지 원칙. 우리가 매일 실천하는 방식입니다.</p></div>
        </div>

        <div class="cards">
          <div class="card rise d3">
            <div class="top"><span class="num">03</span></div>
            <div class="name">문제해결</div>
            <div class="tag">발견하고, 해결하기</div>
            <p class="body">문제는 <b>‘발견하는 순간’</b>부터 시작합니다.<br>우리는 문제를 숨기지 않고, 함께 <b>해결</b>합니다.</p>
          </div>

          <div class="card rise d4">
            <div class="top"><span class="num">04</span></div>
            <div class="name">빠른실행</div>
            <div class="tag">작고, 빠르게</div>
            <p class="body">우리는 <b>작게 시도</b>하고,<br><b>빠르게 검증</b>합니다.</p>
          </div>

          <div class="card rise d5">
            <div class="top"><span class="num">05</span></div>
            <div class="name">책임감</div>
            <div class="tag">주도적으로, 마무리까지</div>
            <p class="body">우리는 <b>내가 시작한 일은 책임지고</b>, 끝까지 마무리합니다.</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
