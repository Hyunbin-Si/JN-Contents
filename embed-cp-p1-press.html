<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록 캠페인 · 약속 1 즉시 누르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">출퇴근 기록 캠페인</span><span class="cp-tag">약속 1/3</span></div>

      <div class="pr-l">
        <div class="pr-n cp-up" style="--d:.2s">1</div>
        <h1 class="pr-h rise d2">출근·퇴근,<br><em class="fx-g" style="--d:1.0s">즉시</em> 누르세요.</h1>
        <p class="pr-s rise d3">출근·퇴근 즉시 눌러 주세요.<br>모두 <b>잘 지켜</b> 주세요.</p>
      </div>

      <!-- 그린 패널: 출근 · 퇴근 두 개의 「누르기」 — GPS 인증 범위는 뺐다(주 메시지가 아님) -->
      <div class="pr-p bx">
        <div class="bt-row">
          <div class="bt cp-pop" style="--d:.9s"><span class="rg" style="--d:1.5s"></span>출근</div>
          <div class="bt cp-pop" style="--d:1.3s"><span class="rg" style="--d:1.9s"></span>퇴근</div>
        </div>
        <div class="bt-go bx cp-up" style="--d:2.4s"><em>즉시</em>&nbsp;누르기</div>
      </div>

      <div class="cp-foot">기록은 <b>즉시</b>, 수정은 <b>3일 이내</b></div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
