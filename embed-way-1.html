<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일하는 방식 ① 동료를 대하는 태도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>.card{--tag-size:32px;}</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="wrap">
        <div class="head">
          <div class="lrow rise d1"><span class="label">WAY OF WORKING</span><span class="chip">GROUP A · 2가지</span></div>
          <h1 class="rise d1">일하는 방식</h1>
          <div class="prow rise d2"><span class="gpill">동료를 대하는 태도</span><p>일과 동료를 대하는 다섯 가지 원칙. 우리가 매일 실천하는 방식입니다.</p></div>
        </div>

        <div class="cards two">
          <div class="card rise d3">
            <div class="top"><span class="num">01</span></div>
            <div class="name">진정성</div>
            <div class="tag">투명하고, 솔직하게</div>
            <p class="body">우리는 <b>상호존중</b>을 기반으로 일하며, 회사를 위해서 숨기지 않고 <b>솔직하게 말합니다.</b></p>
          </div>

          <div class="card rise d4">
            <div class="top"><span class="num">02</span></div>
            <div class="name">협업</div>
            <div class="tag">함께, 성장하기</div>
            <p class="body">우리는 혼자가 아닌,<br><b>함께 일하며 성장</b>합니다.</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
