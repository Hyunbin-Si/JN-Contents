<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베리굿 사용 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --berry:#E8474B;
    --berry-deep:#C93438;
    --berry-soft:#FFE9EA;
    --berry-softer:#FFF6F6;
    --ink:#2B2B33;
    --ink-sub:#6B6B76;
    --cream:#FFFDFB;
    --gold:#F5B71E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#F3EFEC;}
  body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;color:var(--ink);}

  #stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;flex:0 0 auto;width:1920px;height:1080px;transform-origin:center center;background:var(--cream);overflow:hidden;}
  .slide{position:absolute;inset:0;}

  #s2{background:
      radial-gradient(900px 700px at 80% 20%, #FFF3F2 0%, rgba(255,243,242,0) 60%),
      linear-gradient(160deg, #FFFFFF 0%, #FFF8F5 100%);}
  #s2 .layout{position:absolute;inset:0;padding:84px 120px 150px;display:flex;flex-direction:column;}
  .guide-head{display:flex;align-items:center;gap:26px;}
  .guide-head .berry-mini{width:96px;height:96px;border-radius:28px;background:#fff;
    box-shadow:0 10px 26px rgba(232,71,75,.18);padding:6px;
    animation:berryBounce 2.6s ease-in-out infinite;}
  @keyframes berryBounce{
    0%,100%{transform:translateY(0) rotate(-2deg) scale(1);}
    30%{transform:translateY(-24px) rotate(2deg) scale(1.02);}
    55%{transform:translateY(0) rotate(-1deg) scale(.995);}
    70%{transform:translateY(-8px) rotate(1.5deg) scale(1.005);}
  }
  .guide-head .berry-mini img{width:100%;height:100%;border-radius:22px;}
  .guide-title{font-size:74px;font-weight:900;letter-spacing:-.02em;}
  .guide-title em{font-style:normal;color:var(--berry);}
  .guide-sub{margin-left:auto;font-size:26px;font-weight:600;color:var(--ink-sub);
    background:#fff;border:1.5px solid #F3E4E2;border-radius:999px;padding:12px 26px;}

  .guide-cards{margin-top:52px;display:grid;grid-template-columns:1fr 1.35fr;gap:40px;flex:1;}
  .g-card{background:#FFFFFF;border-radius:32px;padding:44px 48px;position:relative;
    box-shadow:0 18px 50px rgba(43,43,51,.08);border:1.5px solid #F6E9E7;
    display:flex;flex-direction:column;}
  .g-num{position:absolute;top:-26px;left:40px;width:60px;height:60px;border-radius:18px;
    background:var(--berry);color:#fff;font-size:32px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(232,71,75,.35);}
  .g-card h3{font-size:40px;font-weight:800;margin-top:14px;}
  .g-card h3 small{display:block;font-size:24px;font-weight:600;color:var(--ink-sub);margin-top:10px;}

  .emoji-showcase{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;}
  .emoji-chip{display:flex;align-items:center;gap:20px;background:var(--berry-softer);
    border:2.5px dashed rgba(232,71,75,.45);border-radius:24px;padding:26px 40px;}
  .emoji-chip img{width:84px;height:84px;border-radius:50%;
    animation:berryBounce 2.6s ease-in-out infinite;}
  .emoji-chip code{font-family:Consolas,'Courier New',monospace;font-size:44px;font-weight:800;color:var(--berry-deep);}
  .reaction-row{display:flex;gap:14px;}
  .reaction{display:inline-flex;align-items:center;gap:10px;background:#EAF3FB;
    border:1.5px solid #BBD9F0;border-radius:999px;padding:10px 20px;font-size:26px;font-weight:700;color:#1264A3;
    opacity:0;transform:scale(.5);animation:popIn .6s cubic-bezier(.18,1.2,.3,1) forwards;}
  @keyframes popIn{to{opacity:1;transform:scale(1);}}
  .reaction img{width:34px;height:34px;border-radius:50%;}
  .reaction:nth-child(1){animation-delay:1.0s;}
  .reaction:nth-child(2){animation-delay:1.35s;}
  .reaction:nth-child(3){animation-delay:1.7s;}
  .reaction .cnt{color:#1264A3;font-weight:800;}

  .steps{flex:1;display:flex;align-items:center;gap:0;margin-top:10px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;}
  .step .icon-box{width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;
    font-size:54px;background:var(--berry-softer);border:1.5px solid #F6DCDA;
    box-shadow:0 10px 24px rgba(232,71,75,.10);}
  .step .icon-box img{width:88px;height:88px;border-radius:50%;}
  .step .st-label{font-size:27px;font-weight:800;}
  .step .st-desc{font-size:21px;font-weight:500;color:var(--ink-sub);line-height:1.5;}
  .step code{font-family:Consolas,monospace;background:#F4F1EE;border-radius:8px;padding:2px 10px;
    font-size:24px;color:var(--berry-deep);font-weight:700;}
  .step-arrow{flex:0 0 64px;font-size:44px;color:var(--berry);font-weight:900;text-align:center;
    animation:arrowNudge 1.4s ease-in-out infinite;}
  @keyframes arrowNudge{0%,100%{transform:translateX(0);}50%{transform:translateX(10px);}}

  .alert-banner{margin-top:44px;display:flex;align-items:center;gap:26px;
    background:#FFF4E5;border:2.5px solid #F5B71E;border-radius:26px;padding:30px 40px;
    box-shadow:0 12px 32px rgba(245,183,30,.18);
    animation:alertGlow 2s ease-in-out infinite;}
  @keyframes alertGlow{
    0%,100%{box-shadow:0 12px 32px rgba(245,183,30,.18);}
    50%{box-shadow:0 12px 44px rgba(245,183,30,.42);}
  }
  .alert-banner .siren{font-size:52px;animation:sirenShake .9s ease-in-out infinite;}
  @keyframes sirenShake{0%,100%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}}
  .alert-banner .al-text{font-size:29px;font-weight:700;line-height:1.55;}
  .alert-banner .al-text strong{color:#C07800;}

  .rise{opacity:0;transform:translateY(36px);animation:riseIn .8s cubic-bezier(.2,.8,.25,1) forwards;}
  .d1{animation-delay:.15s;} .d2{animation-delay:.35s;}
  .d3{animation-delay:.55s;} .d4{animation-delay:.75s;}
  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="slide" id="s2">
      <div class="layout">
        <div class="guide-head rise d1">
          <div class="berry-mini"><img src="berrygood.png" alt="베리굿"></div>
          <h2 class="guide-title">🍓 <em>베리굿</em> 사용 안내</h2>
          <div class="guide-sub">누구나 · 어디서나 · 딸기 하나면 충분해요</div>
        </div>

        <div class="guide-cards">
          <div class="g-card rise d2">
            <div class="g-num">1</div>
            <h3>베리굿 이모지 이름
              <small>리액션으로 바로 적립돼요</small></h3>
            <div class="emoji-showcase">
              <div class="emoji-chip">
                <img src="berrygood.png" alt=":berrygood:">
                <code>:berrygood:</code>
              </div>
              <div class="reaction-row">
                <span class="reaction"><img src="berrygood.png" alt=""> <span class="cnt">1</span></span>
                <span class="reaction"><img src="berrygood.png" alt=""> <span class="cnt">5</span></span>
                <span class="reaction"><img src="berrygood.png" alt=""> <span class="cnt">12</span></span>
              </div>
            </div>
          </div>

          <div class="g-card rise d3">
            <div class="g-num">2</div>
            <h3>채널에 베리굿 앱 추가하기
              <small>3초면 끝나는 초대 방법</small></h3>
            <div class="steps">
              <div class="step">
                <div class="icon-box">⌨️</div>
                <div class="st-label">채널에서<br><code>/invite</code> 입력</div>
              </div>
              <div class="step-arrow">→</div>
              <div class="step">
                <div class="icon-box">➕</div>
                <div class="st-label">앱 추가</div>
                <div class="st-desc">이 채널에 앱 추가 선택</div>
              </div>
              <div class="step-arrow">→</div>
              <div class="step">
                <div class="icon-box"><img src="berrygood.png" alt="베리굿"></div>
                <div class="st-label">베리굿 선택</div>
                <div class="st-desc">초대 완료! 🎉</div>
              </div>
            </div>
          </div>
        </div>

        <div class="alert-banner rise d4">
          <span class="siren">🚨</span>
          <div class="al-text">
            베리굿 이모지 적립은 <strong>채널에서만 가능</strong>합니다.<br>
            새 채널을 생성한 경우, 이모지 적립을 위해 <strong>베리굿 앱을 해당 채널에 초대</strong>해 주세요.
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  function fit(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
