<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재택근무 안내 · ② 어떤 사유가 되나요 (질병·부상 요건)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">재택근무 안내</span><span class="cp-tag">질병·부상·육아 등 · 2/3</span></div>
      <p class="cp-q rise d1" style="top:150px">개인별 재택근무 · 질병·부상 요건</p>
      <h1 class="cp-h1 rise d1" style="top:204px">재택근무, <em class="fx-g" style="--d:.9s">어떤 사유</em>가 되나요?</h1>

      <!-- 조건 + 조건 = 사유: 출퇴근은 어렵지만 + 업무는 가능한 경우 -->
      <div class="rs-eq">
        <div class="rs-box rs-a bx cp-up" style="--d:.5s"><small>신체적·정신적 질환,<br>감염병 또는 부상으로</small>출퇴근은 어렵지만</div>
        <div class="rs-op cp-pop" style="--d:1.0s">+</div>
        <div class="rs-box rs-b bx cp-up" style="--d:1.2s">업무는<br>가능한 경우</div>
        <div class="rs-op cp-pop" style="--d:1.7s">=</div>
        <div class="rs-box rs-c bx cp-pop" style="--d:1.9s">재택근무<br>사유</div>
      </div>

      <div class="rs-ex bx cp-up" style="--d:2.3s">
        <span class="k">예시</span>
        <span class="c cp-pop" style="--d:2.4s">수술 후 회복</span>
        <span class="c cp-pop" style="--d:2.6s">골절·인대 손상 등의 부상</span>
        <span class="c cp-pop" style="--d:2.8s">코로나 등 감염병</span>
        <span class="e">등</span>
      </div>

      <div class="rs-warn bx cp-up" style="--d:3.1s">
        <span class="x">!</span>
        <p>진단서의 ‘<em>휴식 권고</em>’만으로는 재택근무 사유가 되지 않습니다.</p>
      </div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
