<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨텍스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<style>
  /* 큰 연녹색 면 위에 한 문장 */
  .panel{position:absolute;left:150px;right:150px;top:90px;bottom:90px;border-radius:56px;background:var(--green-soft);
    display:flex;align-items:center;justify-content:center;text-align:center;}
  .title{font-size:104px;line-height:1.4;font-weight:800;letter-spacing:-.05em;color:var(--ink);}
  .title em{font-style:normal;color:var(--green-ink);}
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="panel">
        <h1 class="title rise d1"><em class="fx-g" style="--d:.9s">모두</em>가 같은 기준으로 움직일 때,<br>중고나라는 <em class="fx-g" style="--d:2.2s">시장의 기준</em>이 된다.</h1>
      </div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
