<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출퇴근 기록 캠페인 · 약속 2 알아챈 즉시 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">출퇴근 기록 캠페인</span><span class="cp-tag">약속 2/3</span></div>

      <div class="pr-l">
        <div class="pr-n cp-up" style="--d:.2s">2</div>
        <h1 class="pr-h rise d2">깜빡했다면,<br>생각난 순간<br><em class="fx-g" style="--d:1.0s">바로</em> 기록 시작.</h1>
        <p class="pr-s rise d3">기록을 깜빡했다면, 생각난 순간<br><b>바로</b> 기록을 시작해 주세요.</p>
      </div>

      <!-- 그린 패널: 깜빡 → 생각남 → 바로 기록 시작 -->
      <div class="pr-p bx">
        <div class="st-wrap">
          <div class="st dim bx cp-up" style="--d:.8s"><small>STEP 1</small>기록을 깜빡했다</div>
          <div class="st-ar cp-up" style="--d:1.2s"><i></i></div>
          <div class="st bx cp-up" style="--d:1.5s"><small>STEP 2</small>생각난 순간</div>
          <div class="st-ar cp-up" style="--d:1.9s"><i></i></div>
          <div class="st go bx cp-pop" style="--d:2.2s"><em>바로</em>&nbsp;기록 시작</div>
        </div>
      </div>

      <div class="cp-foot">기록은 <b>즉시</b>, 수정은 <b>3일 이내</b></div>
    </section>
  </div>
</div>
<script src="deck.js"></script>
</body>
</html>
