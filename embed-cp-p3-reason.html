<!DOCTYPE html>
<html lang="ko">
<head>

<title>출퇴근 기록 캠페인 · 약속 3 수정 사유 (가능 / 불가)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="deck-cp.css">
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <section class="s">
      <div class="cp-top"><span class="cp-bug">출퇴근 기록 캠페인</span><span class="cp-tag">약속 3/3 · 수정 사유</span></div>
      <h1 class="cp-h1 rise d1">어떤 수정이 <em class="fx-g" style="--d:.9s">가능</em>한가요?</h1>

      <div class="ox-wrap">
        <div class="ox-ok bx rise d3">
          <span class="ox-hd">수정 가능한 사유</span>
          <ul>
            <li class="cp-up" style="--d:1.0s"><i></i>출·퇴근 누락</li>
            <li class="cp-up" style="--d:1.3s"><i></i>시스템 오류</li>
            <li class="cp-up" style="--d:1.6s"><i></i>기타 (휴가 취소 등)</li>
          </ul>
        </div>
        <div class="ox-no bx rise d5">
          <span class="ox-hd">수정 불가</span>
          <div class="nb">
            <div class="x cp-pop" style="--d:1.9s"></div>
            <p>지각, 조퇴를 임의로 조정하기 위한 수정은 <em>불가</em>합니다.</p>
          </div>
        </div>
      </div>

      <div class="cp-foot">기록은 <b>즉시</b>, 수정은 <b>3일 이내</b></div>
    </section>
  </div>
</div>
