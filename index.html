<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중고나라 · 사내 콘텐츠 슬라이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="engine.css">
</head>
<body>

<div id="cursor"></div>
<main id="stage"></main>

<div id="ui">
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="slide-counter">01 / 01</div>
  <button id="btn-fullscreen" title="전체화면 (F)">⛶</button>
  <div id="controls">
    <button class="ctrl-btn" id="btn-prev" title="이전 (←)">&#8592;</button>
    <div id="dots"></div>
    <button class="ctrl-btn" id="btn-play" title="재생/일시정지 (Space)">⏸</button>
    <button class="ctrl-btn" id="btn-next" title="다음 (→)">&#8594;</button>
  </div>
  <div id="pause-overlay">▶</div>
</div>
<div class="fs-badge">전체화면 모드 · 자동 재생 중</div>


<!-- ╔════════════════════════════════════════════════════════════╗
     ║  전체 슬라이드 데이터 (file:// 로컬 실행용 fallback)         ║
     ║  실제 운영 시 slides.json 이 우선 적용됨                     ║
     ║  · 콘텐츠 편집은 각 sections/*.html 또는 slides.json 에서   ║
     ╚════════════════════════════════════════════════════════════╝ -->
<script id="slides-data-json" type="application/json">
{
  "config": {
    "duration": 20,
    "accentColor": "#0dcc5a"
  },
  "slides": [
    {
      "id": 1,
      "type": "embed",
      "duration": 40,
      "src": "embed-welcome.html",
      "title": "신규 오피스 입주 환영"
    }
  ]
}
</script>

<script>
/* 인라인 JSON을 window.SLIDES_DATA 로 노출 */
try {
  window.SLIDES_DATA = JSON.parse(document.getElementById('slides-data-json').textContent);
} catch(e) { console.error('SLIDES_DATA parse error:', e); }
</script>

<script src="engine.js"></script>
</body>
</html>
